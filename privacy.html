<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>JusFeed Backup: política de privacidade</title></head>
<body><h1>Política de privacidade</h1><p>O JusFeed Backup acessa apenas o Google Drive do próprio dono, para gravar e conferir cópias de backup. Não coleta, não compartilha e não vende dados de terceiros. Nenhum dado obtido pelas APIs do Google é usado para outro fim.</p></body></html>
